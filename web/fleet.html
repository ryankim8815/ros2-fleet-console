<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로봇 관제센터 · 플릿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-fleet="1">
<div class="app">
  <header class="topbar">
    <a class="brand" href="fleet.html">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="none" stroke="#2DD4BF" stroke-width="2"/><circle cx="9" cy="14" r="3" fill="#2DD4BF"/><circle cx="19" cy="14" r="3" fill="#FB923C"/></svg>
      로봇 관제센터
    </a>
    <nav aria-label="주 메뉴" style="display: flex; gap: 4px; flex-wrap: wrap">
      <a class="btn btn-sm" href="fleet.html" aria-current="page" style="text-decoration: none; background: var(--raised)">플릿</a>
      <a class="btn btn-sm" href="mapping.html" style="text-decoration: none">지도 만들기</a>
      <a class="btn btn-sm" href="patrol.html" style="text-decoration: none">경비</a>
      <a class="btn btn-sm" href="zones.html" style="text-decoration: none">이동 구역</a>
      <a class="btn btn-sm" href="places.html" style="text-decoration: none">지점</a>
      <a class="btn btn-sm" href="routes.html" style="text-decoration: none">이동 경로</a>
      <a class="btn btn-sm" href="index.html" id="link-dash" style="text-decoration: none">로봇 대시보드</a>
      <a class="btn btn-sm" href="interfaces.html" style="text-decoration: none">ROS 2 인터페이스</a>
      <a class="btn btn-sm" href="setup.html" style="text-decoration: none">로봇 등록</a>
    </nav>
    <button class="pill" data-conn="wait" title="클릭하여 rosbridge 주소 변경"><span class="dot"></span><span data-conn-text>연결 중…</span><span class="mono" data-latency></span></button>
    <div class="spacer"></div>
    <span class="badge ok" id="sum-on"><span class="dot"></span>온라인 —</span>
    <span class="badge" id="sum-off">오프라인 —</span>
    <span class="badge warn hidden" id="sum-warn">경고 —</span>
    <button class="estop" data-estop title="단축키 Esc">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h6l4 4v6l-4 4H5l-4-4V5z" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M5 8h6" stroke="#fff" stroke-width="2"/></svg>
      전체 비상정지
    </button>
  </header>

  <div class="banner hidden" id="map-banner" role="status" style="margin: 16px 20px 0"></div>

  <div class="row" style="padding: 20px; align-items: flex-start">
    <!-- 로봇 목록 -->
    <aside aria-label="로봇 목록" style="flex: 1 1 280px; max-width: 100%; display: flex; flex-direction: column; gap: 10px">
      <div class="panel-head" style="justify-content: space-between">
        <h2>로봇 <span class="muted" style="font-weight: 400" id="robot-count"></span></h2>
        <div class="seg" role="group" aria-label="종류 필터">
          <button data-filter="all" aria-pressed="true">전체</button>
          <button data-filter="turtlebot3" aria-pressed="false">TB3</button>
          <button data-filter="pinky" aria-pressed="false">Pinky</button>
        </div>
      </div>
      <div id="robot-cards" style="display: flex; flex-direction: column; gap: 10px"></div>
      <a href="setup.html" class="btn" style="text-decoration: none; border-style: dashed; min-height: 44px">+ 로봇 등록</a>
    </aside>

    <!-- 공유 지도 -->
    <section class="panel" style="flex: 3 1 520px; padding: 0; gap: 0">
      <div class="panel-head" style="padding: 12px 16px; border-bottom: 1px solid var(--line)">
        <h2>공유 지도</h2>
        <span class="muted mono" style="font-size: 12px" id="map-info">map</span>
        <div class="spacer"></div>
        <div id="map-chips" style="display: flex; gap: 6px; flex-wrap: wrap" role="group" aria-label="지도에 표시할 로봇"></div>
        <div class="seg" role="group" aria-label="레이어">
          <button data-layer="scan" aria-pressed="false">LiDAR</button>
          <button data-layer="path" aria-pressed="true">경로</button>
          <button data-layer="zones" aria-pressed="true">구역</button>
          <button data-layer="places" aria-pressed="true">지점</button>
        </div>
        <button class="btn" id="init-btn" aria-pressed="false" title="AMCL 초기 자세 (&lt;ns&gt;/initialpose)">초기 위치</button>
        <button class="btn" id="goal-btn" aria-pressed="false">목표 지정 → <span id="goal-target">—</span></button>
        <select id="place-goal" aria-label="선택한 로봇을 이름 붙인 지점으로 보내기" title="활성 지도의 지점 (지점 화면에서 추가)"><option value="">지점으로 보내기…</option></select>
        <button class="btn btn-icon" id="follow-btn" aria-pressed="true" aria-label="선택한 로봇 따라가기" title="선택한 로봇 따라가기">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><path d="M8 0v3M8 13v3M0 8h3M13 8h3" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
      <div class="view" id="view" style="height: 560px">
        <canvas id="canvas" role="img" aria-label="공유 지도 위 로봇 위치와 경로"></canvas>
        <div class="hint hidden" id="goal-hint">지도에서 클릭 후 끌어서 방향 지정 · Esc 취소</div>
        <div class="scale" id="no-map-note"></div>
        <div class="dist hidden" id="min-dist" role="status"></div>
        <div class="zoom">
          <button id="zoom-in" aria-label="확대">+</button>
          <button id="zoom-out" aria-label="축소">−</button>
        </div>
      </div>
    </section>

    <!-- 선택한 로봇 -->
    <aside class="col" aria-label="선택한 로봇" style="flex: 1 1 320px" id="detail"></aside>
  </div>

  <div class="row" style="padding: 0 20px 20px">
    <section class="panel" style="flex: 3 1 560px">
      <h2>로봇 상태 비교</h2>
      <div class="table-wrap">
        <table class="t">
          <thead><tr><th>로봇</th><th>종류</th><th>상태</th><th class="num">v (m/s)</th><th class="num" title="플릿 화면은 통신량을 줄이려 odom 을 최대 10 Hz 로 받습니다">/odom Hz (≤10)</th><th>/scan</th><th>배터리</th><th>Nav2 (이 브라우저)</th></tr></thead>
          <tbody id="cmp-rows"></tbody>
        </table>
      </div>
    </section>
    <section class="panel" style="flex: 2 1 380px">
      <div class="panel-head"><h2>이벤트 <span class="muted" style="font-weight: 400; font-size: 12px">전체 로봇 · WARN 이상 /rosout + 상태 변화</span></h2><div class="spacer"></div><button class="btn btn-sm" id="ev-clear">지우기</button></div>
      <div class="console" id="events"><div class="empty">이벤트 대기 중…</div></div>
    </section>
  </div>
</div>
<script src="js/ros.js"></script>
<script src="js/robot.js"></script>
<script src="js/common.js"></script>
<script src="js/view.js"></script>
<script src="js/fleet.js"></script>
</body>
</html>
