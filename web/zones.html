<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로봇 관제센터 · 이동 구역</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-fleet="1">
<div class="app">
  <header class="topbar">
    <a class="brand" href="fleet.html">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="none" stroke="#2DD4BF" stroke-width="2"/><circle cx="9" cy="14" r="3" fill="#2DD4BF"/><circle cx="19" cy="14" r="3" fill="#FB923C"/></svg>
      로봇 관제센터
    </a>
    <nav aria-label="주 메뉴" class="topnav">
      <a class="btn btn-sm" href="fleet.html">플릿</a>
      <a class="btn btn-sm" href="mapping.html">지도 작성</a>
      <a class="btn btn-sm" href="zones.html" aria-current="page">이동 구역</a>
      <a class="btn btn-sm" href="index.html">로봇 대시보드</a>
      <a class="btn btn-sm" href="interfaces.html">ROS 2 인터페이스</a>
      <a class="btn btn-sm" href="setup.html">로봇 등록</a>
    </nav>
    <button class="pill" data-conn="wait" title="클릭하여 rosbridge 주소 변경"><span class="dot"></span><span data-conn-text>연결 중…</span><span class="mono" data-latency></span></button>
    <div class="spacer"></div>
    <button class="estop" data-estop title="단축키 Esc (구역을 그리는 중에는 그리기 취소)">전체 비상정지</button>
  </header>

  <div class="row" style="padding: 20px; align-items: flex-start">
    <section class="panel" style="flex: 3 1 560px; padding: 0; gap: 0">
      <div class="panel-head" style="padding: 12px 16px; border-bottom: 1px solid var(--line)">
        <h1 style="font-size: 16px">이동 구역</h1>
        <label class="muted" style="font-size: 12px; display: flex; align-items: center; gap: 6px">지도
          <select id="map-pick" aria-label="지도 선택"></select></label>
        <span class="badge" id="active-badge">—</span>
        <button class="btn btn-sm" id="make-active">활성 지도로</button>
        <div class="spacer"></div>
        <button class="btn" id="new-keepout"><span class="swatch" style="background: #F87171"></span>금지 구역 그리기</button>
        <button class="btn" id="new-allowed"><span class="swatch" style="background: #4ADE80"></span>허용 구역 그리기</button>
      </div>
      <div class="view" id="view" style="height: 600px">
        <canvas id="canvas" role="img" aria-label="지도와 이동 구역"></canvas>
        <div class="hint hidden" id="draw-hint"></div>
        <div class="legend">
          <div><i style="background: #F87171"></i>금지 구역 (keepout)</div>
          <div><i style="background: #4ADE80"></i>허용 구역 (밖은 금지)</div>
        </div>
        <div class="scale" id="map-meta"></div>
        <div class="zoom">
          <button id="zoom-in" aria-label="확대">+</button>
          <button id="zoom-out" aria-label="축소">−</button>
        </div>
      </div>
    </section>

    <aside class="col" style="flex: 1 1 360px" aria-label="구역 목록">
      <section class="panel">
        <div class="panel-head">
          <h2>구역 <span class="muted" style="font-weight: 400" id="zone-count"></span></h2>
          <div class="spacer"></div>
          <label class="muted" style="font-size: 12px; display: flex; align-items: center; gap: 6px">미리보기
            <select id="preview-robot" aria-label="로봇별 미리보기"><option value="">모든 구역</option></select></label>
        </div>
        <div id="zone-list" class="col" style="gap: 8px"></div>
        <div class="muted" style="font-size: 12px; line-height: 1.6">
          로봇마다 적용됩니다. <b style="color: var(--text)">허용 구역</b>이 하나라도 있는 로봇은 그 밖이 모두 금지입니다.
          Nav2 는 저장 시 만든 마스크(KeepoutFilter)로 피해 가고, 웹 수동 조종도 금지 구역으로 들어가는 명령을 막습니다.
        </div>
        <button class="btn btn-primary" id="save" disabled>저장하고 적용</button>
        <div id="apply-result" class="col" style="gap: 4px"></div>
      </section>
    </aside>
  </div>
</div>
<script src="js/ros.js"></script>
<script src="js/robot.js"></script>
<script src="js/common.js"></script>
<script src="js/view.js"></script>
<script src="js/zones.js"></script>
</body>
</html>
