<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>모바일 조종</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { height: 100%; overscroll-behavior: none; }
  .m { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px calc(12px + env(safe-area-inset-bottom)); }
  .m-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mini { position: relative; height: 200px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--bg-deep); }
  .mini canvas { width: 100%; height: 100%; display: block; }
  .mini .near { position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: var(--text-2); background: rgba(14,17,22,0.85); border-radius: 6px; padding: 4px 8px; }
  .joy-wrap { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 250px; }
  .joy { width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle, #161B22 0%, #12161C 70%); border: 1px solid var(--line-2); position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
  .joy .ring { position: absolute; inset: 40px; border-radius: 50%; border: 1px dashed var(--line); pointer-events: none; }
  .joy .knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--accent); box-shadow: 0 6px 24px rgba(45,212,191,0.35); pointer-events: none; transition: transform 0.12s; }
  .joy.active .knob { transition: none; }
  .joy .arr { position: absolute; fill: var(--muted); pointer-events: none; }
  .bigstop { min-height: 60px; border: 0; border-radius: 14px; background: var(--danger); color: #fff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .speeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .speeds button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--text-2); font-size: 14px; }
  .speeds button[aria-pressed="true"] { background: #2A323D; color: var(--text); font-weight: 600; }
  .tabbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); margin: 0 -16px; padding-top: 6px; }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: var(--muted); text-decoration: none; font-size: 11px; }
  .tabbar a[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .robot-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .robot-chips a { display: flex; flex-direction: column; gap: 2px; flex: none; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--text); text-decoration: none; min-height: 44px; }
  .robot-chips a[aria-current="true"] { border-color: var(--rc); box-shadow: 0 0 0 1px var(--rc); }
  .robot-chips a.off { opacity: 0.55; }
  .robot-chips b { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .robot-chips small { font-size: 11px; color: var(--muted); }
  .qbtn { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text-2); font-size: 12px; flex: none; }
</style>
</head>
<body>
<div class="m">
  <header class="m-head">
    <div>
      <div style="font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px"><span class="swatch" data-robot-color></span><span data-robot-name>원격조종</span></div>
      <button class="pill" data-conn="wait" style="margin-top: 4px; font-size: 12px; min-height: 28px; padding: 4px 10px"><span class="dot"></span><span data-conn-text>연결 중…</span><span class="mono" data-latency></span></button>
    </div>
    <div class="battery" data-battery style="background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px">
      <svg width="26" height="14" viewBox="0 0 26 14" aria-hidden="true"><rect x="1" y="1" width="21" height="12" rx="3" fill="none" stroke="#8B949E" stroke-width="1.5"/><rect x="23" y="4.5" width="2" height="5" rx="1" fill="#8B949E"/><rect data-battery-fill data-max="17" x="3.5" y="3.5" width="1" height="7" rx="1.5" fill="#2DD4BF"/></svg>
      <span data-battery-pct>—%</span>
    </div>
  </header>

  <nav class="robot-chips" id="robot-chips" aria-label="조종할 로봇"></nav>

  <section class="mini">
    <canvas id="mini" role="img" aria-label="로봇 주변 LiDAR 미니 뷰 (위쪽이 로봇 전방)"></canvas>
    <div class="near">전방 최근접 장애물 <span class="mono" id="near">—</span></div>
  </section>

  <div class="grid2">
    <div class="tile" style="background: var(--panel); border: 1px solid var(--line)"><div class="k">선속도 v</div><div class="v" style="font-size: 22px"><span id="v-now">—</span><small> m/s</small></div></div>
    <div class="tile" style="background: var(--panel); border: 1px solid var(--line)"><div class="k">각속도 ω</div><div class="v" style="font-size: 22px"><span id="w-now">—</span><small> rad/s</small></div></div>
  </div>

  <section class="hidden" id="pinky-quick" aria-label="Pinky 표정과 LED" style="display: flex; flex-direction: column; gap: 6px">
    <div class="muted" style="font-size: 12px">표정 · LED <span id="pinky-note"></span></div>
    <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px" id="pinky-row"></div>
  </section>

  <div class="joy-wrap">
    <div class="joy" id="joy" role="application" aria-label="가상 조이스틱: 끌어서 주행, 놓으면 정지">
      <div class="ring"></div>
      <svg class="arr" width="230" height="230" viewBox="0 0 230 230" aria-hidden="true"><path d="M115 16l8 10h-16z M115 214l8-10h-16z M16 115l10 8v-16z M214 115l-10 8v-16z"/></svg>
      <div class="knob" id="knob"></div>
    </div>
    <div class="muted" style="font-size: 12px">손을 떼면 자동 정지 · 데드맨 스위치</div>
  </div>

  <div class="speeds" role="group" aria-label="속도 단계">
    <button data-speed="0.35">저속</button>
    <button data-speed="0.65" aria-pressed="true">보통</button>
    <button data-speed="1">최대</button>
  </div>
  <div class="grid2">
    <button class="bigstop" id="stop-one" style="background: rgba(220,38,38,0.12); border: 1px solid var(--danger); color: var(--danger-3); font-size: 15px">이 로봇 정지</button>
    <button class="bigstop" data-estop style="font-size: 15px">
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h6l4 4v6l-4 4H5l-4-4V5z" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M5 8h6" stroke="#fff" stroke-width="2"/></svg>
      전체 비상정지
    </button>
  </div>

  <nav class="tabbar" aria-label="하단 메뉴">
    <a href="mobile.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2.5" fill="currentColor"/></svg>조종</a>
    <a href="fleet.html"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5l4-2 5 2 4-2v11l-4 2-5-2-4 2z M5.5 1.5v11 M10.5 3.5v11" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>플릿</a>
    <a href="alerts.html"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l5.5 2v4c0 3.5-2.5 6-5.5 7-3-1-5.5-3.5-5.5-7v-4z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>경보</a>
    <a href="interfaces.html"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12l3.5-5 3 3 3-6 3.5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>인터페이스</a>
  </nav>
</div>
<script src="js/ros.js"></script>
<script src="js/robot.js"></script>
<script src="js/common.js"></script>
<script src="js/view.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
