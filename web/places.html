<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로봇 관제센터 · 지점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-fleet="1">
<div class="app">
  <header class="topbar">
    <a class="brand" href="fleet.html">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="none" stroke="#2DD4BF" stroke-width="2"/><circle cx="9" cy="14" r="3" fill="#2DD4BF"/><circle cx="19" cy="14" r="3" fill="#FB923C"/></svg>
      로봇 관제센터
    </a>
    <nav aria-label="주 메뉴" class="topnav">
      <a class="btn btn-sm" href="fleet.html">플릿</a>
      <a class="btn btn-sm" href="mapping.html">지도 만들기</a>
      <a class="btn btn-sm" href="patrol.html">경비</a>
      <a class="btn btn-sm" href="zones.html">이동 구역</a>
      <a class="btn btn-sm" href="places.html" aria-current="page">지점</a>
      <a class="btn btn-sm" href="routes.html">이동 경로</a>
      <a class="btn btn-sm" href="index.html">로봇 대시보드</a>
      <a class="btn btn-sm" href="interfaces.html">ROS 2 인터페이스</a>
      <a class="btn btn-sm" href="setup.html">로봇 등록</a>
    </nav>
    <button class="pill" data-conn="wait" title="클릭하여 rosbridge 주소 변경"><span class="dot"></span><span data-conn-text>연결 중…</span><span class="mono" data-latency></span></button>
    <div class="spacer"></div>
    <button class="estop" data-estop title="단축키 Esc (지점을 찍는 중에는 찍기 취소)">전체 비상정지</button>
  </header>

  <div class="row" style="padding: 20px; align-items: flex-start">
    <section class="panel" style="flex: 3 1 560px; padding: 0; gap: 0">
      <div class="panel-head" style="padding: 12px 16px; border-bottom: 1px solid var(--line)">
        <h1 style="font-size: 16px">지점</h1>
        <label class="muted" style="font-size: 12px; display: flex; align-items: center; gap: 6px">지도
          <select id="map-pick" aria-label="지도 선택"></select></label>
        <span class="badge" id="active-badge">—</span>
        <div class="spacer"></div>
        <label class="muted" style="font-size: 12px; display: flex; align-items: center; gap: 6px">로봇 위치로
          <select id="from-robot" aria-label="로봇 현재 위치로 지점 추가"><option value="">로봇 선택…</option></select></label>
        <button class="btn btn-primary" id="add-btn" aria-pressed="false"><span class="swatch" style="background: #C084FC"></span>지도에 지점 찍기</button>
      </div>
      <div class="view" id="view" style="height: 600px">
        <canvas id="canvas" role="img" aria-label="지도와 이름 붙인 지점"></canvas>
        <div class="hint hidden" id="pick-hint"></div>
        <div class="legend">
          <div><i style="background: #C084FC"></i>지점 (선은 도착 방향)</div>
          <div><i style="background: #FBBF24"></i>선택한 지점</div>
        </div>
        <div class="scale" id="map-meta"></div>
        <div class="zoom">
          <button id="zoom-in" aria-label="확대">+</button>
          <button id="zoom-out" aria-label="축소">−</button>
        </div>
      </div>
    </section>

    <aside class="col" style="flex: 1 1 360px" aria-label="지점 목록">
      <section class="panel hidden" id="new-panel" aria-label="새 지점">
        <div class="panel-head"><h2>새 지점</h2></div>
        <form id="new-form" class="col" style="gap: 8px">
          <input id="new-name" maxlength="40" placeholder="이름 (예: 충전소, 회의실 앞)" aria-label="새 지점 이름" required>
          <div class="place-grid">
            <label>x (m)<input type="number" step="0.01" id="new-x" required></label>
            <label>y (m)<input type="number" step="0.01" id="new-y" required></label>
            <label>방향 (°)<input type="number" step="1" id="new-deg" value="0"></label>
          </div>
          <input id="new-note" maxlength="200" placeholder="메모 (선택)" aria-label="새 지점 메모">
          <div class="row" style="gap: 8px">
            <button class="btn btn-primary" type="submit">저장</button>
            <button class="btn" type="button" id="new-cancel">취소</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>지점 <span class="muted" style="font-weight: 400" id="place-count"></span></h2>
          <div class="spacer"></div>
          <input type="search" id="filter" placeholder="이름 검색" aria-label="지점 이름 검색" style="width: 140px">
        </div>
        <div id="place-list" class="col" style="gap: 8px"></div>
        <div class="muted" style="font-size: 12px; line-height: 1.6">
          지도를 클릭하면 그 자리에, 클릭한 채 끌면 끈 방향을 <b style="color: var(--text)">도착 방향</b>으로 찍습니다.
          좌표는 지도의 <span class="mono">map</span> 프레임(m)이고 <span class="mono">data/places.db</span>(SQLite)에 저장됩니다.
          플릿 화면에서 <b style="color: var(--text)">지점으로 보내기</b>로 로봇을 보낼 수 있습니다.
        </div>
      </section>
    </aside>
  </div>
</div>
<script src="js/ros.js"></script>
<script src="js/robot.js"></script>
<script src="js/common.js"></script>
<script src="js/view.js"></script>
<script src="js/places.js"></script>
</body>
</html>
